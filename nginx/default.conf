server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Sidan är EN html-fil med ankarsektioner. Det som inte finns ska ge 404,
    # inte tyst serveras som index.html — annars svarar varje felstavad sökväg 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # Kubernetes/Docker-probe. Egen location så att access-loggen inte fylls.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # OBS: caching sköts med `expires`, inte `add_header`. En `add_header` i ett
    # location-block slår ut ALLA ärvda add_header från server-nivån — då hade
    # säkerhetsheaders nedan tyst försvunnit på just css och js.
    location = /index.html {
        expires -1;              # Cache-Control: no-cache
    }

    location ~* \.(css|js|svg|woff2?|png|jpg|webp|ico)$ {
        expires 30d;             # byts ut via ny image, aldrig på plats
    }

    # CSP:n listar exakt de externa källor sidan använder i dag: Bootstrap från
    # jsdelivr, typsnitt från Google. Lägger du till en CDN, ett analysskript
    # eller en inline-<script> måste den uppdateras här — annars blockeras den
    # i webbläsaren utan att något syns i serverloggen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript image/svg+xml;
}
